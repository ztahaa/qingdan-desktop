name: Build Qingdan for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Test UI and local storage
        run: npm test
      - name: Verify frontend
        run: npm run build
      - name: Test database migrations and backups
        working-directory: src-tauri
        run: cargo test --release --lib
      - name: Build desktop app
        run: npm run desktop:build
      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/Qingdan | Out-Null
          Copy-Item scripts/update-portable.ps1 staging/Qingdan/update-portable.ps1
          Copy-Item src-tauri/target/release/qingdan-desktop.exe staging/Qingdan/Qingdan.exe
          Set-Content -Path staging/Qingdan/portable.mode -Value "Store app data beside the executable." -Encoding ascii
          @"
          Qingdan portable edition

          1. Extract the Qingdan folder to D:\Qingdan (or another writable folder).
          2. Double-click Qingdan.exe.
          3. Tasks and backups are stored in the data folder beside the program.

          To update: close Qingdan and run update-portable.ps1 from this NEW package.
          Choose the existing application folder. Only the program is replaced; data is preserved.

          Do not run the program directly from inside the downloaded ZIP.
          "@ | Set-Content -Path staging/Qingdan/README.txt -Encoding utf8
          Compress-Archive -Path staging/Qingdan -DestinationPath staging/Qingdan-Windows-Portable.zip -Force
      - name: Upload portable edition
        uses: actions/upload-artifact@v4
        with:
          name: Qingdan-Windows-Portable
          path: staging/Qingdan
          if-no-files-found: error
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Qingdan-Windows-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
